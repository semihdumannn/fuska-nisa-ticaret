name: nisa_ticaret
description: Nisa Ticaret - Su ve Meşrubat Dağıtım Uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
    sdk: '>=3.0.0 <4.0.0'

dependencies:
    flutter:
        sdk: flutter

    # Firebase
    # firebase_core: ^2.24.2
    # firebase_auth: ^4.16.0
    # cloud_firestore: ^4.14.0
    # firebase_storage: ^11.6.0
    # firebase_messaging: ^14.7.10
    # firebase_remote_config: ^4.3.0  # ⭐ Remote config yönetimi

    firebase_core: ^4.3.3
    firebase_auth: ^6.4.0
    cloud_firestore: ^6.3.0
    firebase_storage: ^13.3.0
    firebase_messaging: ^16.2.0
    firebase_remote_config: ^6.4.0
    # google_maps_flutter: ^3.4.1 # ⭐ Maps için

    # Caching & Local Storage
    hive: ^2.2.3
    hive_flutter: ^1.1.0

    # Versioning & Updates
    package_info_plus: ^9.0.1
    in_app_update: ^4.0.2

    # State Management
    flutter_riverpod: ^3.3.1
    riverpod_annotation: ^4.0.2

    # Navigation
    go_router: ^17.2.3

    # UI
    cached_network_image: ^3.3.1
    shimmer: ^3.0.0
    flutter_svg: ^2.0.9
    lottie: ^3.0.0
    badges: ^3.1.2

    # Harita & Konum
    google_maps_flutter: ^2.9.0
    geolocator: ^14.0.2
    geocoding: ^3.0.0

    # Bildirim
    flutter_local_notifications: ^21.0.0

    # Utilities
    intl: ^0.20.2
    shared_preferences: ^2.2.2
    connectivity_plus: ^7.1.1
    url_launcher: ^6.2.4
    image_picker: ^1.0.7
    permission_handler: ^12.0.1
    uuid: ^4.3.3
    equatable: ^2.0.5
    dartz: ^0.10.1
    carousel_slider: ^5.1.2
    fl_chart: ^0.69.0

    # Rapor export — CSV/TXT olusturma ve paylasma
    path_provider: ^2.1.4
    share_plus: ^10.0.0

    # Network
    dio: ^5.4.0
    retrofit: ^4.0.3
    pretty_dio_logger: ^1.3.1

    # Code Generation (annotations)
    freezed_annotation: ^3.0.0
    json_annotation: ^4.8.1

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_native_splash: ^2.4.3
    flutter_launcher_icons: ^0.13.1
    flutter_lints: ^6.0.0
    build_runner: ^2.4.8
    riverpod_generator: ^4.0.3

    # Code Generation
    freezed: ^3.0.0
    json_serializable: ^6.7.1
    retrofit_generator: ^10.2.6
    mockito: ^5.4.4
flutter_native_splash:
    color: "#E73A99"
    android: true
    ios: true
    android_gravity: center
    ios_content_mode: center
    fullscreen: true

flutter_launcher_icons:
    android: 'launcher_icon'
    ios: true
    image_path: 'assets/images/app_icon.png'
flutter:
    uses-material-design: true
    assets:
        - assets/images/
        - assets/icons/
    fonts:
        - family: Poppins
          fonts:
              - asset: assets/fonts/Poppins-Regular.ttf
              - asset: assets/fonts/Poppins-Medium.ttf
                weight: 500
              - asset: assets/fonts/Poppins-SemiBold.ttf
                weight: 600
              - asset: assets/fonts/Poppins-Bold.ttf
                weight: 700
